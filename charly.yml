discover:
    - path: box
      recursive: true
    - path: candy
      recursive: true

# =============================================================================
# WI-10's gate: BUILD the runner image from this repo's box and assert the artefact.
#
# The ledger names two things for this work item - the image's own plan, and a
# microVM boot that asserts the guest contract. THIS BED DOES THE FIRST AND NOT
# YET THE SECOND, and says so rather than describing the pair as if both ran: the
# boot is the phase this repo adds when the venue can serve a plugin-backed step.
# It cannot today - see the note on the plan step below and opencharly/charly#916.
#
# The image is built FROM THIS REPO'S BOX by a pinned remote ref, so the bed
# boots the very image the repo ships instead of a second copy of its
# definition - and a guest needs no checkout for that, which is why the ref
# form is the honest one here.
#
# What can be asserted without networking: the CONTRACT lives on the root drive
# (read back with debugfs, the producer's own technique) and the BOOT lives on
# the VMM's serial output, which the ledger measured as the VMM's stdout. No
# TAP, no root and no network are needed, exactly as Firecracker's own recipe
# showed.
# =============================================================================
fireactions-runner-vm-base:
    vm:
        source:
            kind: cloud_image
            url: https://geo.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2
            base_user: arch
            distro: arch
        backend: libvirt
        disk_size: 20G
        ram: 4G
        cpu: 2
        machine: q35
        firmware: bios
        ssh:
            port_auto: true
            key_source: generate
        cloud_init:
            timezone: UTC
            package:
                - sudo

fireactions-runner-vm-host:
    local:
        description: >-
            The boot venue: the pinned Firecracker release and kernel that start the artefact, and the engine
            the image build runs through. No project is written in - the bed builds the image from this repo's
            own box by a pinned remote ref, so there is no second definition to drift.
        candy:
            - '@github.com/opencharly/layer-firecracker/candy/layer-firecracker:v2026.287.1531'
            # The plugin's TREE, so `charly firecracker image build` resolves at this venue.
            # Without it the verb is an unknown command and the step answers with charly's usage
            # text: `firecracker` is an out-of-process command plugin, and a project that does not
            # carry the candy has nothing for the loader to prepend. Measured 2026-10-16: the two
            # candies above deliver fine and the plugin is simply absent from the set.
            - '@github.com/opencharly/plugin-firecracker/candy/plugin-firecracker:v2026.288.0016'
            # The DELIVERER. `plugin-deploy-firecracker` serves `step:plugin-tree`, which fills
            # /tmp/charly-plugins from the deploying charly's store - so the tree above arrives from
            # the product instead of being manufactured by this bed's own shell. The variable that
            # points the loader at it is still OURS to set (opencharly/charly#977 keeps that layer in
            # the product); what changes is who puts the files there.
            - '@github.com/opencharly/plugin-deploy-firecracker/candy/plugin-deploy-firecracker:v2026.292.1949'

check-fireactions-runner-vm:
    vm:
        from: fireactions-runner-vm-base
        disposable: true
        lifecycle: dev
        description: >-
            WI-10's gate on a disposable guest: build the runner image from this repo's box under the pinned
            VMM and kernel, and assert the artefact is produced. This is the FIRST of the two things the
            ledger names for WI-10; the microVM boot that asserts the guest contract on the root drive and
            on the serial output is the second, and it is not in this plan because a plugin-backed step is
            an unknown command at this venue until plugin-tree delivery lands (opencharly/charly#916).
        check-fireactions-runner-vm-member:
            local:
                from: fireactions-runner-vm-host
        plan:
            # RED UNTIL PLUGIN-TREE DELIVERY LANDS. The body invokes
            # `charly firecracker image build`, and `firecracker` is an
            # out-of-process command plugin: at this venue the verb is not served,
            # so charly answers `Usage: charly <command> [flags]` and the step
            # exits 1. Measured 2026-10-16: five of this bed's six steps pass and
            # this is the only one that fails, for that reason. Delivery route:
            # sdk#398. Issue: opencharly/charly#916.
            - check: the runner image builds from this repo's box, pinned
              id: runner-image-builds
              command: |
                set -eu
                # The deploy own layout is the ONLY place charly is looked for: measured, the deploy provides
                # it as an executable FILE at /tmp/charly-CalVer-hash.
                #
                # This block was written once with an UNQUOTED heredoc, and bash expanded every $ variable in
                # it before the file was written - which is how a guest that HAD charly reported that it had
                # none, and why the pinned ref below was empty. The check echoes what it resolved.
                CHARLY=
                for f in /tmp/charly-*; do
                  if [ -f "$f" ] && [ -x "$f" ]; then CHARLY="$f"; break; fi
                done
                if [ -z "$CHARLY" ]; then
                  echo "NO CHARLY FOUND in the guest. PATH=$PATH; /tmp holds:" >&2
                  ls -la /tmp >&2
                  exit 1
                fi
                echo "charly: $CHARLY" >&2
                # The plugin TREE. `charly firecracker` is an out-of-process command plugin, and the
                # delivery a Containerfile performs at image-build time has no equivalent on a
                # cloud_image venue - so the tree is provisioned here, from the plugin the candy
                # installed. CHARLY_PLUGIN_DIR PREPENDS a directory ahead of the FHS one the loader
                # searches, so this is the whole contract: a directory holding the executable, and
                # the variable pointing at it in this shell.
                # THE CLEAN MEASUREMENT. This bed no longer MANUFACTURES the tree - the
                # `plugin-tree:` step in the runner candy's plan is the only source. So this
                # block only reports what the STEP left, which is what makes the run able to
                # distinguish "the step delivered nothing" from "the bed made it itself".
                CHARLY_PLUGIN_DIR=/tmp/charly-plugins
                export CHARLY_PLUGIN_DIR
                echo "tree after the deliver step: $(ls /tmp/charly-plugins 2>/dev/null || echo ABSENT)" >&2
                cd /opt
                if ! "$CHARLY" firecracker image build \
                       '@github.com/opencharly/layer-fireactions-runner/box/fireactions-runner:1e3e39f097d78e6328d26aca168d3baea2061265' \
                       --ref localhost/fireactions-runner-proof:1 \
                       --kernel /var/lib/firecracker/kernels/5.10/vmlinux > /tmp/runner-build.log 2>&1; then
                  echo "=== the image build failed; its own output follows:" >&2
                  head -10 /tmp/runner-build.log >&2
                  exit 1
                fi
                tail -3 /tmp/runner-build.log >&2